<section class="password-login-page">
  <app-page-header
    title="Connexion par mot de passe"
    description="Saisissez votre adresse email et votre mot de passe."
  />

  <app-password-login-form (loggedIn)="onLoggedIn()" />

  <p class="password-login-page__alternative">
    Vous préférez éviter le mot de passe ?
    <a routerLink="/login/email-code">Recevoir un code par email</a>
  </p>
</section>
