<header class="app-header">
  <a class="app-header__brand" routerLink="/app">
    Ramalo
  </a>

  <div class="app-header__context">
    @if (shouldShowOrganizationSelect()) {
      <label class="app-header__organization-select-label">
        <span class="app-header__organization-select-text">Organisation</span>

        <select
          class="app-header__organization-select"
          (change)="selectOrganization($any($event.target).value)"
        >
          @for (organization of availableOrganizations(); track organization.organizationId) {
            <option
              [value]="organization.organizationId"
              [selected]="currentOrganization()?.id === organization.organizationId"
            >
              {{ organization.organizationName }}
            </option>
          }
        </select>
      </label>
    }

    @if (shouldShowClubSelect()) {
      <label class="app-header__club-select-label">
        <span class="app-header__club-select-text">Club</span>

        <select
          class="app-header__club-select"
          (change)="selectClub($any($event.target).value)"
        >
          <option
            value=""
            disabled
            [selected]="currentClub() === null"
          >
            Choisir un club
          </option>

          @for (club of availableClubs(); track club.clubId) {
            <option
              [value]="club.clubId"
              [selected]="currentClub()?.id === club.clubId"
            >
              {{ club.clubName }}
            </option>
          }
        </select>
      </label>
    } @else if (shouldShowReadonlyClub() && currentClub(); as club) {
      <span class="app-header__club">
        {{ club.name }}
      </span>
    }
  </div>

  <div class="app-header__user">
    @if (currentUser(); as user) {
      <span class="app-header__username">
        {{ user.displayName }}
      </span>

      <button
        class="app-header__logout"
        type="button"
        (click)="onLogout()"
      >
        Déconnexion
      </button>
    } @else {
      <span>Utilisateur</span>
    }
  </div>
</header>
