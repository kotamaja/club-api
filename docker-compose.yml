services:

  mysql-dev:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
#      - ./docker/database/schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - club-api-mysql-dev:/var/lib/mysql

  php:
    build:
      context: .
      dockerfile: ./Dockerfile-dev
    working_dir: /var/www
    volumes:
      - ./symfony:/var/www:delegated
      - ./.docker-cache/composer:/tmp/composer
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql-dev:3306/${MYSQL_DATABASE}?serverVersion=${MYSQL_VERSION}
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /tmp/composer/cache
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
      JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'
      JWT_PASSPHRASE: '${JWT_PASSPHRASE:?JWT_PASSPHRASE is required}'
      DEV_AUTO_LOGIN_USER: ${DEV_AUTO_LOGIN_USER}

    user: "${UID:-1000}:${GID:-1000}"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./symfony:/var/www
      - ./docker/dev/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/dev/nginx/certs:/etc/nginx/certs:ro



  node:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile_node
      target: node-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "4200:4200"
    user: "${UID}:${GID}"
    tty: true
    stdin_open: true
    command: bash



volumes:
  club_api_composer_cache_dev:
  club-api-mysql-dev: